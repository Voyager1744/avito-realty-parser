[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "avito-realty-parser"
version = "0.1.0"
description = ""
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Dmitriy Ushakov Air", email = "udv8@ya.ru" }
]
requires-python = ">=3.11,<4.0"

dependencies = [
    "pydantic[email]>=2.12.5,<3.0.0",
    "playwright>=1.57.0,<2.0.0",
    "asyncpg>=0.31.0,<0.32.0",
    "redis>=7.1.0,<8.0.0",
    "requests>=2.32.5,<3.0.0",
    "python-dotenv>=1.2.1,<2.0.0",
    "tenacity>=9.1.2,<10.0.0",
    "loguru>=0.7.3,<0.8.0",
    "fake-useragent>=2.2.0",
    "ruff>=0.14.10",
    "pre-commit>=4.5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "black>=25.12.0,<26.0.0",
    "flake8>=7.3.0,<8.0.0",
    "mypy>=1.19.1,<2.0.0",
    "pre-commit>=4.5.1,<5.0.0",
]

[tool.ruff]
# Общие настройки
line-length = 88
target-version = "py311"
src = ["avito_realty_parser"]  # помогает ruff правильно разрешать импорты

# Включенные правила
select = [
    "E",   # pycodestyle (ошибки)
    "W",   # pycodestyle (предупреждения)
    "F",   # pyflakes
    "B",   # bugbear
    "C90", # mccabe (complexity)
    "ISC", # isort
    "B9",  # flake8-bandit, flake8-bugbear и др.
]
ignore = [
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",  # docstrings
]

# Настройки isort через ruff
[tool.ruff.isort]
combine-as-imports = true
order-by-type = false
known-first-party = ["avito_realty_parser"]

[tool.ruff.flake8-quotes]
inline-quotes = "single"

[tool.flake8]
ignore = [
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", "E501"
]
max-line-length = 99
select = "C,E,F,W,B,B950"
per-file-ignores = { "__init__.py" = ["F401"] }
