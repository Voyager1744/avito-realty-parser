[tool.poetry]
name = "avito-realty-parser"
version = "0.1.0"
description = ""
authors = ["Dmitriy Ushakov Air <udv8@ya.ru>"]
license = "MIT"
readme = "README.md"
packages = [{include = "avito_realty_parser"}]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = {extras = ["email"], version = "^2.12.5"}
playwright = "^1.57.0"
asyncpg = "^0.31.0"
redis = "^7.1.0"
requests = "^2.32.5"
python-dotenv = "^1.2.1"
tenacity = "^9.1.2"
loguru = "^0.7.3"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-asyncio = "^1.3.0"
black = "^25.12.0"
flake8 = "^7.3.0"
mypy = "^1.19.1"
pre-commit = "^4.5.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# Настройки Flake8
[tool.flake8]
ignore = [
    "D100",  # нет docstring в модуле
    "D101",  # нет docstring в классе
    "D102",  # нет docstring в методе
    "D103",  # нет docstring в функции
    "D104",  # нет docstring в пакете
    "D105",  # нет docstring в атрибуте
    "D106",  # нет docstring в public nested class
    "D107",  # нет docstring в __init__
]
max-line-length = 88
select = "C,E,F,W,B,B950"  # типично: синтаксис, стилистика, описания
per-file-ignores = { "__init__.py" = ["F401"] }
